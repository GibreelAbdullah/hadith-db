name: Generate Data

on:
  push:
    branches: [master]
    paths:
      - 'data/books/**'
      - 'convert.py'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run conversion script
        run: python3 convert.py

      - name: Commit and push generated gradings
        # metadata.json is gitignored and NOT committed here — the frontend
        # deploy regenerates it via convert.py after cloning this repo. Only
        # gradings.json (fetched cross-origin from this repo's Pages) and any
        # other non-ignored data changes are committed back.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: regenerate gradings"
          git push
